name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          $v = if ($ref -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          # Qt 6.11.3 起 Windows 仓库按编译器拆分，aqtinstall 3.3.0 找不到；支持已合入 master（PR #1000）但未发布，先固定到这个提交
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        # 加引号：pwsh 会把未加引号的 -DX=0.1.0 在点号处拆开
        run: cmake -S . -B build -A x64 "-DSNAPPIN_VERSION=${{ steps.ver.outputs.version }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $dir = 'dist/SnapPin'
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item build/Release/SnapPin.exe $dir
          # 文字识别用的 ONNX Runtime（构建时已复制到 exe 旁边）
          Copy-Item build/Release/onnxruntime.dll $dir
          # 文字识别模型（构建时已复制到 exe 旁边的 ocr/）
          Copy-Item build/Release/ocr $dir -Recurse
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime "$dir/SnapPin.exe"
          # 直接附带 VC++ 运行库，免去用户安装 vc_redist
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT\*.dll" | Copy-Item -Destination $dir
          # 发布包标记：有它自动更新才会覆盖安装目录
          New-Item -ItemType File "$dir/snappin.portable" | Out-Null
          Compress-Archive -Path $dir -DestinationPath "SnapPin-$v-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: SnapPin-*-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: |
          ref='${{ github.ref_name }}'
          if [[ $ref =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then v=${BASH_REMATCH[1]}; else v=0.0.0; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: jurplel/install-qt-action@v4
        with:
          # 6.8.3 的 CMake 仍链接 AGL 框架，新版 Xcode 的 SDK 已移除它；
          # 6.12 之前的托盘在 macOS 27 上读取非鼠标事件的 clickCount，反复点击托盘图标会闪退
          version: '6.12.0'
          aqtversion: '==3.3.*'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Configure
        # 只出 Apple 芯片版本：ONNX Runtime（文字识别）最新稳定版没有 Intel 版 macOS 库
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DSNAPPIN_VERSION=${{ steps.ver.outputs.version }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Import signing certificate
        # 固定的自签名证书 "SnapPin Release"：签名身份不变，升级后系统权限（屏幕录制、辅助功能）仍然有效。
        # 没有配置 secrets（如 fork 仓库）时跳过，退回 ad-hoc 签名
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "未配置签名证书，使用 ad-hoc 签名"; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/id.p12"

      - name: Package
        run: |
          v='${{ steps.ver.outputs.version }}'
          macdeployqt build/SnapPin.app
          # 发布包标记：有它自动更新才会替换 .app；必须在签名之前放入，否则会破坏签名
          mkdir -p build/SnapPin.app/Contents/Resources && touch build/SnapPin.app/Contents/Resources/snappin.portable
          # 不是苹果开发者证书，首次打开仍需在“隐私与安全性”里允许
          identity=-
          if security find-identity -p codesigning | grep -q '"SnapPin Release"'; then identity="SnapPin Release"; fi
          codesign --force --deep --sign "$identity" build/SnapPin.app
          codesign -d -r- build/SnapPin.app
          ditto -c -k --keepParent build/SnapPin.app "SnapPin-$v-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: SnapPin-*-macos-arm64.zip

  linux:
    # 在较老的系统上构建，AppImage 才能在更多发行版上运行（glibc 向后兼容）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: |
          ref='${{ github.ref_name }}'
          if [[ $ref =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then v=${BASH_REMATCH[1]}; else v=0.0.0; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxcb1-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfuse2

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          aqtversion: '==3.3.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          # Wayland 平台插件已包含在基础包里，不是单独的模块
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          -DSNAPPIN_VERSION=${{ steps.ver.outputs.version }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          v='${{ steps.ver.outputs.version }}'
          DESTDIR=AppDir cmake --install build
          base=https://github.com/linuxdeploy
          wget -q $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          # 同时打包 X11（xcb）和 Wayland 平台插件，运行时由 Qt 按会话类型选择；
          # Qt 6.12 起 Wayland 客户端并入 qtbase，平台插件合并为 libqwayland.so
          EXTRA_PLATFORM_PLUGINS=libqwayland.so \
            ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv SnapPin-*.AppImage "SnapPin-$v-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: SnapPin-*-linux-x86_64.AppImage

  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SnapPin-*.zip
            SnapPin-*.AppImage
          generate_release_notes: true
