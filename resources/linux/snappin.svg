<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- SnapPin 应用图标（水墨风）：一笔圆相作取景框，框住朱日、远山与飞鸟，右下角一方朱印。
       ≤32px 用 snappin-small.svg；改完运行 tools/gen_icons.py 重新生成各平台图标 -->
  <defs>
    <radialGradient id="paper" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#FCF8EF"/>
      <stop offset="1" stop-color="#EADFC8"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.25  0 0 0 0.10 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="brush" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.4"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="0.8"/></filter>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A6470" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5A6470" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2226" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1E2226" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#F0603A"/>
      <stop offset="1" stop-color="#C8321F"/>
    </radialGradient>
    <clipPath id="inside"><circle cx="128" cy="126" r="70"/></clipPath>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#paper)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="#fff" filter="url(#grain)"/>
  <rect x="17" y="17" width="222" height="222" rx="51" fill="none" stroke="#B8A888" stroke-opacity="0.45" stroke-width="2"/>
  <g clip-path="url(#inside)">
    <!-- 朱日 -->
    <circle cx="150" cy="96" r="17" fill="url(#sun)" filter="url(#soft)"/>
    <!-- 远山（淡）与近山（浓） -->
    <g filter="url(#wash)">
      <path d="M 50 170 L 74 138 L 84 146 L 104 112 L 120 132 L 132 124 L 160 150 L 176 140 L 206 170 Z" fill="url(#far)"/>
      <path d="M 50 196 L 66 168 Q 74 160 80 166 L 94 150 Q 100 144 106 152 L 122 170 L 134 162 Q 140 158 146 164 L 164 178 L 206 196 Z" fill="url(#near)"/>
    </g>
    <!-- 飞鸟 -->
    <g fill="none" stroke="#1E2226" stroke-width="2.6" stroke-linecap="round">
      <path d="M 98 92 Q 103 86 108 91 Q 113 86 118 90"/>
      <path d="M 116 104 Q 119 100 122 103 Q 125 100 128 102"/>
    </g>
  </g>
  <!-- 一笔圆相：起笔重、收笔出锋，缺口留在右上 -->
  <path d="M 182.9 65.0 L 180.8 62.5 L 178.5 60.0 L 176.1 57.6 L 173.6 55.4 L 171.0 53.2 L 168.3 51.1 L 165.5 49.2 L 162.6 47.3 L 159.6 45.6 L 156.5 43.9 L 153.3 42.4 L 150.1 41.1 L 146.7 39.9 L 143.3 39.2 L 139.8 38.7 L 136.3 38.3 L 132.8 38.1 L 129.3 38.0 L 125.8 38.0 L 122.3 38.2 L 118.8 38.5 L 115.3 39.0 L 111.9 39.6 L 108.4 40.3 L 105.0 41.2 L 101.7 42.2 L 98.4 43.4 L 95.1 44.7 L 91.9 46.1 L 88.8 47.6 L 85.7 49.3 L 82.8 51.1 L 79.8 53.0 L 77.0 55.1 L 74.3 57.2 L 71.6 59.5 L 69.1 61.9 L 66.6 64.3 L 64.3 66.9 L 62.0 69.5 L 59.9 72.3 L 57.9 75.1 L 56.0 78.0 L 54.3 80.9 L 52.6 84.0 L 51.1 87.1 L 49.7 90.2 L 48.5 93.4 L 47.4 96.6 L 46.4 99.9 L 45.5 103.2 L 44.8 106.6 L 44.2 109.9 L 43.8 113.3 L 43.5 116.7 L 43.3 120.1 L 43.3 123.5 L 43.4 126.8 L 43.6 130.2 L 44.0 133.6 L 44.5 136.9 L 45.2 140.2 L 45.9 143.4 L 46.8 146.7 L 47.9 149.8 L 49.0 153.0 L 50.3 156.1 L 51.7 159.1 L 53.2 162.0 L 54.8 164.9 L 56.5 167.7 L 58.4 170.5 L 60.3 173.1 L 62.4 175.7 L 64.5 178.2 L 66.7 180.6 L 69.1 182.9 L 71.5 185.1 L 73.9 187.3 L 76.5 189.3 L 79.1 191.2 L 81.8 193.0 L 84.6 194.7 L 87.4 196.2 L 90.3 197.7 L 93.3 199.1 L 96.2 200.3 L 99.3 201.4 L 102.3 202.4 L 105.4 203.3 L 108.5 204.0 L 111.7 204.7 L 114.9 205.2 L 118.0 205.5 L 121.2 205.8 L 124.4 205.9 L 127.6 205.9 L 130.8 205.8 L 134.0 205.6 L 137.1 205.2 L 140.3 204.8 L 143.4 204.1 L 146.5 203.4 L 149.5 202.6 L 152.6 201.6 L 155.6 200.5 L 158.5 199.3 L 161.4 198.0 L 164.2 196.6 L 167.0 195.1 L 169.7 193.5 L 172.3 191.7 L 174.9 189.9 L 177.4 187.9 L 179.8 185.9 L 182.1 183.8 L 184.4 181.6 L 186.5 179.2 L 188.6 176.9 L 190.6 174.4 L 192.4 171.8 L 194.2 169.2 L 195.9 166.5 L 197.4 163.8 L 198.8 161.0 L 200.2 158.1 L 201.4 155.2 L 202.4 152.3 L 203.4 149.3 L 204.2 146.2 L 205.0 143.2 L 205.5 140.1 L 206.0 137.0 L 206.3 133.8 L 206.5 130.7 L 206.6 127.6 L 206.5 124.4 L 206.3 121.3 L 206.0 118.2 L 205.5 115.1 L 203.0 115.5 L 203.1 118.5 L 203.1 121.5 L 203.0 124.5 L 202.9 127.5 L 202.5 130.5 L 202.1 133.4 L 201.6 136.3 L 200.9 139.2 L 200.2 142.1 L 199.3 144.9 L 198.3 147.7 L 197.2 150.4 L 196.0 153.1 L 194.8 155.7 L 193.4 158.3 L 191.9 160.8 L 190.3 163.2 L 188.6 165.6 L 186.9 167.9 L 185.0 170.1 L 183.1 172.2 L 181.1 174.3 L 179.0 176.2 L 176.8 178.1 L 174.6 179.9 L 172.3 181.6 L 170.0 183.2 L 167.6 184.7 L 165.2 186.1 L 162.7 187.5 L 160.1 188.7 L 157.5 189.8 L 154.9 190.8 L 152.3 191.7 L 149.6 192.5 L 146.9 193.2 L 144.2 193.8 L 141.4 194.3 L 138.7 194.6 L 135.9 194.9 L 133.2 195.1 L 130.4 195.1 L 127.7 195.1 L 124.9 194.9 L 122.2 194.7 L 119.4 194.3 L 116.7 193.8 L 114.1 193.3 L 111.4 192.6 L 108.8 191.8 L 106.2 190.9 L 103.6 190.0 L 101.1 188.9 L 98.6 187.7 L 96.2 186.5 L 93.9 185.1 L 91.5 183.7 L 89.3 182.2 L 87.1 180.6 L 85.0 178.9 L 82.9 177.1 L 80.9 175.2 L 79.0 173.3 L 77.2 171.3 L 75.4 169.2 L 73.7 167.1 L 72.2 164.9 L 70.6 162.6 L 69.2 160.3 L 67.9 157.9 L 66.7 155.5 L 65.6 153.1 L 64.5 150.5 L 63.6 148.0 L 62.8 145.4 L 62.0 142.8 L 61.4 140.2 L 60.9 137.5 L 60.5 134.8 L 60.2 132.1 L 60.0 129.4 L 59.9 126.7 L 59.9 124.0 L 60.1 121.2 L 60.3 118.5 L 60.6 115.8 L 61.1 113.2 L 61.7 110.5 L 62.3 107.9 L 63.1 105.3 L 64.0 102.7 L 65.0 100.2 L 66.1 97.7 L 67.3 95.3 L 68.6 92.9 L 70.0 90.5 L 71.4 88.3 L 73.0 86.1 L 74.7 83.9 L 76.4 81.8 L 78.3 79.8 L 80.2 77.9 L 82.1 76.1 L 84.2 74.3 L 86.3 72.7 L 88.5 71.1 L 90.8 69.6 L 93.1 68.2 L 95.4 66.9 L 97.9 65.7 L 100.3 64.6 L 102.8 63.7 L 105.3 62.8 L 107.9 62.0 L 110.5 61.3 L 113.1 60.8 L 115.7 60.3 L 118.4 60.0 L 121.0 59.8 L 123.7 59.6 L 126.3 59.6 L 129.0 59.7 L 131.6 59.9 L 134.3 60.2 L 136.9 60.6 L 139.4 61.2 L 142.0 61.8 L 144.6 62.2 L 147.2 62.6 L 149.8 63.1 L 152.4 63.7 L 155.0 64.5 L 157.6 65.3 L 160.2 66.2 L 162.7 67.3 L 165.2 68.4 L 167.6 69.7 L 170.1 71.0 L 172.4 72.5 L 174.8 74.0 Z" fill="#141414" filter="url(#brush)"/>
  <!-- 朱印 -->
  <g transform="translate(190 186) rotate(-6)">
    <rect x="-17" y="-17" width="34" height="34" rx="4" fill="#C0392B" filter="url(#brush)"/>
    <g fill="none" stroke="#FBF3E6" stroke-width="3.2" stroke-linecap="square">
      <rect x="-10.5" y="-10.5" width="21" height="21"/>
      <path d="M -5 -4 L 5 -4 M 0 -4 L 0 6 M -5 2 L -2 6"/>
    </g>
  </g>
</svg>
